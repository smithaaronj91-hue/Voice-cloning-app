<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Cloning & Text-to-Speech App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 1.1em;
        }
        
        select, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        textarea {
            min-height: 150px;
            resize: vertical;
            font-family: inherit;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1em;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: 600;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        
        .audio-player {
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            display: none;
        }
        
        audio {
            width: 100%;
            margin-top: 10px;
        }
        
        .download-btn {
            margin-top: 10px;
            background: #28a745;
            font-size: 1em;
        }
        
        .download-btn:hover {
            box-shadow: 0 10px 20px rgba(40, 167, 69, 0.4);
        }
        
        .feature-note {
            background: #fff3cd;
            border: 1px solid #ffc107;
            color: #856404;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .voice-info {
            font-size: 0.9em;
            color: #666;
            margin-top: 5px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎤 Voice Cloning & TTS</h1>
        <p class="subtitle">Convert text to speech with beautiful voices</p>
        
        <div class="feature-note">
            <strong>✨ Featured:</strong> Multiple female voice options including US, UK, Australian, Indian, and South African accents!
        </div>
        
        <form id="ttsForm">
            <div class="form-group">
                <label for="voiceSelect">Select Voice:</label>
                <select id="voiceSelect" required>
                    <option value="">Loading voices...</option>
                </select>
                <div class="voice-info" id="voiceInfo"></div>
            </div>
            
            <div class="form-group">
                <label for="textInput">Enter Text to Convert:</label>
                <textarea id="textInput" placeholder="Type or paste your text here..." required></textarea>
            </div>
            
            <button type="submit" class="btn" id="convertBtn">
                🎵 Convert to Speech
            </button>
        </form>
        
        <div id="status" class="status"></div>
        
        <div id="audioPlayer" class="audio-player">
            <h3>🔊 Your Generated Audio:</h3>
            <audio id="audioElement" controls></audio>
            <button class="btn download-btn" id="downloadBtn">
                ⬇️ Download Audio File
            </button>
        </div>
    </div>
    
    <script>
        let currentFilename = null;
        
        // Load available voices
        async function loadVoices() {
            try {
                const response = await fetch('/api/voices');
                const voices = await response.json();
                
                const select = document.getElementById('voiceSelect');
                select.innerHTML = '';
                
                // Group voices by type
                const systemVoices = voices.filter(v => v.type === 'system');
                const googleVoices = voices.filter(v => v.type === 'google');
                
                // Add Google voices first (featured)
                if (googleVoices.length > 0) {
                    const googleGroup = document.createElement('optgroup');
                    googleGroup.label = '⭐ Google TTS (Recommended)';
                    googleVoices.forEach(voice => {
                        const option = document.createElement('option');
                        option.value = voice.id;
                        option.textContent = voice.name;
                        option.dataset.gender = voice.gender;
                        googleGroup.appendChild(option);
                    });
                    select.appendChild(googleGroup);
                }
                
                // Add system voices
                if (systemVoices.length > 0) {
                    const systemGroup = document.createElement('optgroup');
                    systemGroup.label = '💻 System Voices';
                    systemVoices.forEach(voice => {
                        const option = document.createElement('option');
                        option.value = voice.id;
                        option.textContent = voice.name;
                        option.dataset.gender = voice.gender;
                        systemGroup.appendChild(option);
                    });
                    select.appendChild(systemGroup);
                }
                
                // Select first Google voice by default
                if (googleVoices.length > 0) {
                    select.value = googleVoices[0].id;
                }
                
                updateVoiceInfo();
            } catch (error) {
                console.error('Error loading voices:', error);
                showStatus('Failed to load voices', 'error');
            }
        }
        
        // Update voice info when selection changes
        function updateVoiceInfo() {
            const select = document.getElementById('voiceSelect');
            const option = select.options[select.selectedIndex];
            const voiceInfo = document.getElementById('voiceInfo');
            
            if (option && option.dataset.gender) {
                voiceInfo.textContent = `Gender: ${option.dataset.gender}`;
            } else {
                voiceInfo.textContent = '';
            }
        }
        
        document.getElementById('voiceSelect').addEventListener('change', updateVoiceInfo);
        
        // Show status message
        function showStatus(message, type = 'info') {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status ${type}`;
            status.style.display = 'block';
            
            if (type === 'success' || type === 'error') {
                setTimeout(() => {
                    status.style.display = 'none';
                }, 5000);
            }
        }
        
        // Handle form submission
        document.getElementById('ttsForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const text = document.getElementById('textInput').value;
            const voiceId = document.getElementById('voiceSelect').value;
            const convertBtn = document.getElementById('convertBtn');
            
            if (!text || !voiceId) {
                showStatus('Please fill in all fields', 'error');
                return;
            }
            
            // Disable button and show loading
            convertBtn.disabled = true;
            convertBtn.textContent = '⏳ Converting...';
            showStatus('Converting text to speech...', 'info');
            
            try {
                const response = await fetch('/api/convert', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ text, voice_id: voiceId }),
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    currentFilename = data.filename;
                    showStatus('✓ Conversion successful!', 'success');
                    
                    // Show audio player
                    const audioPlayer = document.getElementById('audioPlayer');
                    const audioElement = document.getElementById('audioElement');
                    audioElement.src = `/api/download/${data.filename}`;
                    audioPlayer.style.display = 'block';
                    
                    // Scroll to audio player
                    audioPlayer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                } else {
                    showStatus(`Error: ${data.error}`, 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showStatus('Failed to convert text to speech', 'error');
            } finally {
                // Re-enable button
                convertBtn.disabled = false;
                convertBtn.textContent = '🎵 Convert to Speech';
            }
        });
        
        // Handle download button
        document.getElementById('downloadBtn').addEventListener('click', () => {
            if (currentFilename) {
                window.location.href = `/api/download/${currentFilename}`;
            }
        });
        
        // Load voices on page load
        loadVoices();
    </script>
</body>
</html>
